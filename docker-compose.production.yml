volumes:
  pg_data:
  static:

services:
  db:
    restart: always
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    restart: always
    # build: ./backend/
    image: olshanskyvv/taski_backend:latest
    env_file: .env
    volumes:
      - static:/backend_static
    depends_on:
      db:
        condition: service_healthy

  frontend:
    env_file: .env
    # build: ./frontend/
    image: olshanskyvv/taski_frontend:latest
    volumes:
      - static:/frontend_static
    command: cp -r /app/build/. /frontend_static/

  gateway:
    restart: always
    # build: ./gateway/
    image: olshanskyvv/taski_gateway:latest
    depends_on:
      - backend
      - frontend
    volumes:
      - static:/staticfiles
    ports:
      - 8000:80